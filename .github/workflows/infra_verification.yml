name: Verify Infrastructure Setup before Deployment

on:
  pull_request: 
    branches:
      - main
    paths:
      - infra-setup/**
      - .github/workflows/**

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  setup-infra:
    runs-on: ubuntu-latest
    environment: dev

    env:
      RG_NAME: ${{ vars.RESOURCE_GROUP }}
      TEMPLATE_PATH: infra-setup/main.bicep
      CLIENT_ID: ${{ secrets.OIDC_AZURE_CLIENT_ID }}
      TENANT_ID: ${{ secrets.OIDC_AZURE_TENANT_ID }}
      SUBSCRIPTION_ID: ${{ secrets.OIDC_AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: $CLIENT_ID
          tenant-id: $TENANT_ID
          subscription-id: $SUBSCRIPTION_ID

      - name: Install Azure ML CLI
        run: az extension add -n ml -y

      - name: Run Infra Setup Command
        run: |
          az deployment group what-if \
            --resource-group "$RG_NAME" \
            --template-file "$TEMPLATE_PATH" \
            --parameters aiServices=myai firstProjectName=myai-proj